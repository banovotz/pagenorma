name: Deploy Jekyll with Minification

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # Službena i održavana akcija (zamjena za deprecated actions/setup-ruby)
        with:
          ruby-version: '3.2'
          bundler-cache: true
          bundler: default # Dozvoljava prilagodbu bez rušenja u frozen modu

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5 # Nadogradnja s v4 na v5

    # Korak za zamjenu placeholdera u JS datoteci prije builda
      - name: Inject Firebase API Key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          sed -i "s/__FIREBASE_API_KEY__/$FIREBASE_API_KEY/g" app/features/subscription/subscription.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4