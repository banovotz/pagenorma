<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 60" width="305" height="60" fill="none">
  <!-- AMBLEM BRAND-A (Knjiga s p i n slovima) -->
  <g transform="translate(4, 6)">
    <!-- Lijeva stranica (Izvornik / Podloga) -->
    <path d="M6 12C6 8.68629 8.68629 6 12 6H24V42H12C8.68629 42 6 39.3137 6 36V12Z" fill="#E0F2F1" stroke="#008080" stroke-width="2.5"/>
    
    <!-- Desna stranica (Prijevod / Radna površina) -->
    <path d="M24 6H36C39.3137 6 42 8.68629 42 12V36C42 39.3137 39.3137 42 36 42H24V6Z" fill="#FFFFFF" stroke="#008080" stroke-width="2.5"/>
    
    <!-- Linije teksta -->
    <path d="M11 14H19" stroke="#008080" stroke-width="2" stroke-linecap="round"/>
    <path d="M11 34H19" stroke="#008080" stroke-width="2" stroke-linecap="round"/>
    <path d="M29 14H37" stroke="#008080" stroke-width="2" stroke-linecap="round"/>
    <path d="M29 34H37" stroke="#008080" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Slova p i n -->
    <text x="15" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#008080" text-anchor="middle">p</text>
    <text x="33" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#008080" text-anchor="middle">n</text>

    <!-- Središnji zlatni indikator -->
    <path d="M24 2V46" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="2" r="2.5" fill="#D97706"/>
  </g>

  <!-- SPOJENA TIPOGRAFIJA (pagenorma) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="60" y="38" font-size="28" letter-spacing="-0.5">
      <tspan font-weight="300" fill="#1F2937">page</tspan><tspan font-weight="700" fill="#008080">norma</tspan>
    </text>
  </g>

  <!-- OZNAKA IZDANJA "QS" (Quiet Studio Badge) -->
  <rect x="216" y="16" width="38" height="24" rx="6" fill="#008080" stroke="#D97706" stroke-width="1"/>
  <text x="222" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">QS</text>
</svg>
