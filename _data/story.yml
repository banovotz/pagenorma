section_id: "story"
badge: "Behind the Code"
heading: "Born Out of Real-World Literary Workflows"
subheading: "How a literary translator built the missing tool for manuscript pacing and textual precision."

paragraphs:
  - text: "Managing multiple book translation projects across different publishing houses at the same time quickly reveals a gap in standard software. Commercial CAT tools treat literature like technical manuals, while generic spreadsheets force you into endless manual math just to answer three basic questions: <strong>Am I on track for my deadline?</strong>, <strong>What are my actual projected earnings?</strong> and <strong>How much mistakes i still have to handle?</strong>" 
  - text: "pagenorma was created directly at the translation desk to solve these exact friction points. It combines character or page based pacing (calculated in standard translation pages, character count or word count), <strong>dynamic daily targets</strong>, and <strong>integration</strong> of source text (ePub, PDF) and translation txt (Word and Google Docs integration)."
  - text: "Beyond tracking deadlines and finances, long-form prose demands deep narrative consistency. The <strong>built-in textual analysis with glossary and concordance engine</strong> provides lightweight QA helping you verify key terminology, track recurring terms and phrases, and <strong>compare source and your translation side-by-side</strong> without losing context."

quote:
  text: "We needed a workspace that helps us proofread and improve our translation text while giving us absolute clarity over our deadlines and income."
  author: "Davor Banović"
  role: "Literary Translator & Creator of pagenorma"