section_id: "story"
badge: "Behind the Code"
heading: "Born Out of Real-World Literary Workflows"
subheading: "How a literary translator built the missing tool for manuscript pacing and textual precision."

paragraphs:
  - text: "Managing multiple book translation projects across different publishing houses at the same time quickly reveals gaps in the software available to translators. Commercial CAT tools treat literature like technical manuals, while keeping track of deadlines and the tempo needed to meet them requires endless manual math. As a translator, I am constantly faced with three basic questions: <strong>Am I on track for my deadline?</strong> <strong>What are my projected earnings?</strong> and <strong>How many mistakes do I still need to fix?</strong>" 
  - text: "pagenorma was created directly at the translation desk to cut out that daily hassle. By <strong>reading directly from your active document (Word or Google Docs)</strong>, it <strong>compares your actual progress against your source file and deadline.</strong> Instead of manual calculations, you get <strong>dynamic daily targets and a real-time pace forecast, tailored to how you count progress, whether by standard pages, characters, or words.</strong> It also provides you with <strong>insights into your monthly earnings for each project.</strong>"
  - text: "Beyond tracking deadlines and finances, long-form prose demands narrative consistency. The built-in analysis engine automatically <strong>extracts a glossary and concordance from your text to provide AI-powered QA.</strong> With <strong>inline commentary and a searchable side-by-side view</strong>, verifying key terms, idioms, and stylistic choices has never been smoother."

quote:
  text: "We needed a workspace that helps us proofread and improve our translation text while giving us absolute clarity over our deadlines and income."
  author: "Davor Banović"
  role: "Literary Translator & Creator of pagenorma"