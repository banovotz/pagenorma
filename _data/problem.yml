section_id: "problem"
heading: "A tool designed by a literary translator, <strong>specifically for their peers</strong>,"
subheading: "...built arround questions every translators has when a translation project ramps up:"

pain_points:
  - id: "how-long"
    title: "How long it will take?"
    description: "pagenorma <strong>monitors</strong> the percentage of translated text, <strong>forecasts</strong> the exact daily pace you need to hit your deadlines, and <strong>provides an overview of the</strong> status of all your active translation projects."
    icon: "grid_off"

  - id: "how-much"
    title: "How much will I make?"
    description: "pagenorma <strong>calculates</strong> your gross earnings with built-in deduction tracking for taxes, pension, and health insurancece giving you a <strong>realistic view</strong> of your true net income."
    icon: "pin"

  - id: "any-mistake"
    title: "Am I making any mistake?"
    description: "Our automated AI assisted tool builds a <strong>linked glossary</strong> directly from your project. View your translation and the original text <strong>side-by-side</strong> with AI's spot-on <strong>inline commentary</strong>."
    icon: "schedule"