section_id: "features"
heading: "Built for the Way Translators Actually Work"
subheading: "Features designed to support your specific manuscript workflow without interfering with your craft."

features_list:
  - id: "pacing"
    title: "Smart Pacing & Deadline Management"
    description: "Set your total page or character target, start and end dates, and weekend preferences. The app continuously calculates your Required Daily Pace vs. your Planned Daily Pace, warning you in advance if you're falling behind schedule."
    badge: "Core Feature"
    image: "/assets/images/mockup1.jpeg"

  - id: "integrations"
    title: "Native ePub & Google Docs Integration"
    description: "Fetch progress instantly. Parse your original .epub source file to determine absolute volume, and connect directly to your working Google Doc to sync your translation progress in real time."
    badge: "Automation"
    image: "/assets/images/mockup7.jpeg"

  - id: "analysis"
    title: "Deep Textual & Concordance Analysis"
    description: "Maintain terminology consistency across a 100,000-word manuscript. Extract key phrases, analyze character/term occurrences, and run concordance checks between source text and your translation without losing context."
    badge: "Concordance"
    image: "/assets/images/mockup5.jpeg"

  - id: "metrics"
    title: "Character-Accurate Progress Tracking"
    description: "Ditch manual spreadsheet formulas. Automatically calculate progress using precise character counts (with spaces) and standard translation page metrics, giving you and your publishers crystal-clear status updates."
    badge: "Metrics"
    image: "/assets/images/mockup4.jpeg"

  - id: "privacy"
    title: "Local-First & Privacy-Focused"
    description: "Your intellectual property stays yours. Built as a PWA with local storage (IndexedDB), your manuscripts, drafts, and source files stay in your browser and on your machine."
    badge: "Security"
    image: "/assets/images/mockup6.jpeg"

  - id: "multilanguage"
    title: "Multi-Language Support"
    description: "Work seamlessly across multiple languages. The app supports all latin scripts and provides intuitive tools for managing translations in different linguistic contexts."
    badge: "Multi-language"
    image: "/assets/images/mockup5.jpeg"