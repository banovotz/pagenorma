section_id: "features"
heading: "Built for the Way Translators Actually Work"
subheading: "Features designed to support your specific manuscript workflow without interfering with your craft."

features_list:
  - id: "integrations"
    title: "ePub, PDF, Word & Google Docs Integration"
    description: "Pagenorma <strong>parses your source file (ePub, PDF)</strong> to determine absolute volume, and <strong>connects directly to your working Google Doc or Word translation doc</strong> to sync your translation progress in <strong>real time</strong>."
    badge: "Automation"
    image: "/assets/images/mockup7.jpeg"

  - id: "pacing"
    title: "Smart Pacing & Deadline Management"
    description: "Set your total pages or words per day <strong>target</strong>, start and end dates, and weekend preferences. Pagenorma <strong>continuously calculates your Required Daily Pace vs. your Planned Daily Pace</strong>, warning you in advance if you're falling behind schedule."
    badge: "Core Feature"
    image: "/assets/images/mockup1.jpeg"

  - id: "multilanguage"
    title: "Support Translation in Multiple Languages"
    description: "<strong>Translate in multiple languages.</strong> The app supports <strong>all latin scripts</strong> and provides <strong>intuitive tools</strong> such as side-by-side view, searchable glossary of all terms with concordance, and smart AI commmentary for managing translations regardles of source and translation language."
    badge: "Multi-language"
    image: "/assets/images/mockup5.jpeg"

  - id: "analysis"
    title: "Deep Textual & Concordance Analysis"
    description: "<strong>Maintain terminology consistency</strong> across a 100,000-word manuscript. Generate glossary with all the terms used in your text, analyze phrase/term occurrences, and run <strong>concordance checks</strong> between source text and your translation without losing context."
    badge: "Concordance"
    image: "/assets/images/mockup5.jpeg"

  - id: "metrics"
    title: "Track Monthly Earnings Accross All Projects"
    description: "Ditch manual spreadsheet formulas. <strong>Automatically calculate your earnings</strong> for each project/month with <strong>crystal-clear overview of your income for each translation project.</strong>"
    badge: "Financial Analytics"
    image: "/assets/images/mockup4.jpeg"

  - id: "privacy"
    title: "Local-First & Privacy-Focused"
    description: "<strong>Your intellectual property stays yours.</strong> Built as a PWA with local storage (IndexedDB), your manuscripts, drafts, and original source files <strong>stay in your browser and on your computer.</strong>"
    badge: "Security"
    image: "/assets/images/mockup6.jpeg"

