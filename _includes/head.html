<head>
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "pagenorma" }}</title>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta name="title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "pagenorma" }}">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="charset" content="UTF-8">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pagenorma.eu">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "pagenorma" }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="./app/public/icons/icon-512.png">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="pagenorma">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://pagenorma.eu">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "pagenorma" }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="./app/public/icons/icon-512.png">


  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YS4729VL89"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-YS4729VL89');
  </script>

  <script>
  (function forwardAuthParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');

    if (mode && oobCode) {
      // Preusmjeri na PWA aplikaciju i proslijedi sve parametre + otvori #settings
      window.location.href = '/app/?mode=' + encodeURIComponent(mode) + '&oobCode=' + encodeURIComponent(oobCode) + '#settings';
    }
  })();
</script>
  <!-- Self-hosted fonts (Lora serif & Inter sans). Preloading the two
       above-the-fold faces starts them with the HTML instead of after CSS. -->
  <link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/lora-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <!-- Prije CSS-a: uključi parallax/reveal stilove samo na širem zaslonu i kad
       korisnik nije zatražio smanjenu animaciju (prefers-reduced-motion). Na
       telefonima ih izostavljamo jer iOS Safari sporo ponovo crta animirani SVG.
       Postavljanje klase prije CSS-a sprječava invalidaciju stilova nakon layouta. -->
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
        window.matchMedia('(min-width: 769px)').matches) {
      document.documentElement.classList.add('js-effects');
    }
  </script>

  <!-- Glavni CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Below-the-fold fonts (Lora italic + diacritics): non-render-blocking so
       they never extend the LCP critical path. -->
  <link rel="stylesheet" href="{{ '/assets/css/fonts-deferred.css' | relative_url }}" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="{{ '/assets/css/fonts-deferred.css' | relative_url }}"></noscript>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/favicon.ico">

  <!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} blog" href="{{ '/feed.xml' | relative_url }}">
</head>
